# =============================================================================
# docker-compose.yml - Projeto: Análise de Dengue vs. Clima no Brasil
# =============================================================================
# Sobe 4 serviços:
#   1. postgres           → Banco de dados (metadados do Airflow + dados de dengue)
#   2. airflow-init       → Inicializa o banco e cria o usuário admin (roda 1x só)
#   3. airflow-webserver  → Interface gráfica (localhost:8082)
#   4. airflow-scheduler  → Motor que executa as DAGs
#
# Portas usadas (evitando conflito com outros projetos):
#   PostgreSQL  → 5433
#   Airflow UI  → 8082
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment: &airflow-common-env
    # Executor local: mais simples, sem Redis/Celery
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # Conexão com o PostgreSQL (metadados do Airflow)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    # Segurança: chave de criptografia dos XComs
    AIRFLOW__CORE__FERNET_KEY: ''

    # Não carrega os exemplos padrão
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    # DAGs ficam pausadas quando criadas (boa prática)
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'

    # Permite acesso à API REST do Airflow
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'

    # Pacotes extras instalados automaticamente no Airflow
    # Open-Meteo e InfoDengue são APIs públicas — sem chave necessária
    _PIP_ADDITIONAL_REQUIREMENTS: pandas requests sqlalchemy psycopg2-binary scikit-learn numpy python-dotenv

  volumes:
    # Pasta das DAGs
    - ./dags:/opt/airflow/dags

    # Logs de execução de cada tarefa
    - ./logs:/opt/airflow/logs

    # Lógica do pipeline (extractor, transformer, loader)
    - ./src:/opt/airflow/src

  # ID do usuário no Linux (no WSL2, rode: echo $UID para descobrir o seu)
  user: "${AIRFLOW_UID:-50000}:0"

  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy


services:

  # ---------------------------------------------------------------------------
  # 1. BANCO DE DADOS POSTGRESQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: dengue_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      # Persiste os dados mesmo que o container seja reiniciado
      - postgres_data:/var/lib/postgresql/data
      # Script SQL que cria o banco dengue_brasil na inicialização
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      # Porta 5433 para não conflitar com outros projetos PostgreSQL na 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------------------------
  # 2. INICIALIZAÇÃO DO AIRFLOW (roda uma vez e encerra)
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: dengue_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags}

        # Migra o banco de dados do Airflow
        airflow db migrate

        # Cria o usuário admin para acessar a interface web
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@dengue.com \
          --password admin

        echo "Airflow inicializado com sucesso!"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
    user: "0:0"
    volumes:
      - .:/sources

  # ---------------------------------------------------------------------------
  # 3. INTERFACE WEB DO AIRFLOW (acesse: http://localhost:8082)
  #    Login: admin / admin
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: dengue_airflow_webserver
    command: webserver
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # 4. AGENDADOR DO AIRFLOW (monitora e executa as DAGs)
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: dengue_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


# =============================================================================
# VOLUMES PERSISTENTES
# =============================================================================
volumes:
  postgres_data:
    driver: local
